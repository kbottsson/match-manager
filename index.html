<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Match Manager has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://match.kbottsson.com/">
  <meta http-equiv="refresh" content="0; url=https://match.kbottsson.com/">
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
           background: #fbfaf7; color: #101418; padding: 24px; }
    a { color: #0a6b36; font-weight: 600; }
    p { margin: 6px 0; }
  </style>
</head>
<body>
  <div>
    <p><strong>Match Manager has moved to its own domain.</strong></p>
    <p><a href="https://match.kbottsson.com/">Continue to kbottsson.com</a></p>
  </div>
  <script>
    // Unregister the old origin's service worker, which would otherwise keep
    // serving a cached copy of the app from this address.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => rs.forEach((r) => r.unregister()))
        .catch(() => {});
    }
    location.replace('https://match.kbottsson.com/' + location.hash);
  </script>
</body>
</html>
